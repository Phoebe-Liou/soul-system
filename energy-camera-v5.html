<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Camera v5</title><style>
body{margin:0;background:#f6f0e9;color:#554d66;font-family:-apple-system,"PingFang TC",sans-serif}main{max-width:700px;margin:auto;padding:16px}.c{background:#fffdf9;border:1px solid #cdb88a;border-radius:20px;padding:15px;margin:12px 0}h1{text-align:center;font-family:serif}.stage{position:relative;aspect-ratio:3/4;background:#111;border-radius:17px;overflow:hidden}video,#pic,#fx{position:absolute;width:100%;height:100%;object-fit:cover}#pic,#fx{display:none}.guide{position:absolute;inset:8% 27% 6%;border:1px dashed #ffe4a5;border-radius:45%}.st{text-align:center;padding:12px;font-weight:bold}.bar{height:8px;background:#e4ddea;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#806e9b}.btn{display:flex;gap:8px;margin-top:10px}button{flex:1;border:0;border-radius:13px;padding:13px;background:#78678f;color:#fff;font-weight:bold}.zones{display:grid;gap:7px}.z{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;background:#f3eff6;border-radius:12px;padding:9px}.dot{width:12px;height:34px;border-radius:8px}.z small{display:block}.val{text-align:right}.note{font-size:12px;line-height:1.65}#res,#work{display:none}</style></head><body><main><h1>Energy Camera v5</h1><div style="text-align:center">Soul System · 人體七區域 CMOS 光學訊號圖</div>
<div class="c"><div class="stage"><video id="v" autoplay muted playsinline></video><canvas id="pic"></canvas><canvas id="fx"></canvas><div class="guide"></div></div><div class="st" id="st">前 3 秒請離開畫面，之後站回中央。</div><div class="bar"><i id="pg"></i></div><div class="btn"><button id="go">開始 10 秒掃描</button><button id="flip">切換鏡頭</button></div></div>
<div class="c" id="res"><h3 id="head"></h3><div class="zones" id="zones"></div><p id="meta"></p></div>
<div class="c note"><b>v5 原理：</b>七個位置參考七脈輪的傳統身體位置，但程式不預先指定顏色。前 3 秒建立空景基準，後 7 秒分析人物；外圍背景用來補償整體光線與色彩漂移。每區只有超過門檻才顯影。CMOS 將入射光學訊號轉換成電荷，但網頁取得的是處理後影格，不能直接讀取單顆電子；這些光學差異本身不能證明脈輪、特殊電子能量或量子場。</div><canvas id="work" width="168" height="224"></canvas>
<script>
const Q=s=>document.querySelector(s),v=Q('#v'),w=Q('#work'),x=w.getContext('2d',{willReadFrequently:true}),st=Q('#st'),pg=Q('#pg');let stream,face='user',busy=0,W=168,H=224,Y=[.09,.20,.32,.45,.58,.71,.84],names=['頭頂區','眉心區','喉部區','心口區','上腹區','下腹區','骨盆區'];
async function cam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face}},audio:false});v.srcObject=stream;await v.play()}cam().catch(()=>st.textContent='請允許相機權限');flip.onclick=async()=>{if(busy)return;face=face==='user'?'environment':'user';await cam()};
const L=a=>.2126*a[0]+.7152*a[1]+.0722*a[2],sl=m=>new Promise(r=>setTimeout(r,m));
function f(){x.drawImage(v,0,0,W,H);let d=x.getImageData(0,0,W,H).data,A=[0,0,0,0],E=[0,0,0,0],Z=Array.from({length:7},()=>[0,0,0,0]);for(let y=0;y<H;y++)for(let q=0;q<W;q++){let i=(y*W+q)*4,r=d[i],g=d[i+1],b=d[i+2],xn=q/W,yn=y/H;for(let a of [A]){a[0]+=r;a[1]+=g;a[2]+=b;a[3]++}if(xn<.14||xn>.86){E[0]+=r;E[1]+=g;E[2]+=b;E[3]++}if(xn>.27&&xn<.73)for(let z=0;z<7;z++)if(Math.abs(yn-Y[z])<.055){Z[z][0]+=r;Z[z][1]+=g;Z[z][2]+=b;Z[z][3]++}}let av=a=>[a[0]/a[3],a[1]/a[3],a[2]/a[3]];return{a:av(A),e:av(E),z:Z.map(av)}}
async function col(sec,lo,hi){let A=[],fl=[],last,t=performance.now();while(performance.now()-t<sec*1000){let F=f();A.push(F);if(last)fl.push(Math.abs(L(F.a)-L(last.a)));last=F;pg.style.width=(lo+(hi-lo)*(performance.now()-t)/(sec*1000))+'%';await sl(125)}return{A,fl}}
function mean(F,k){if(k==='z')return Array.from({length:7},(_,z)=>[0,1,2].map(c=>F.reduce((s,f)=>s+f.z[z][c],0)/F.length));return[0,1,2].map(c=>F.reduce((s,f)=>s+f[k][c],0)/F.length)}
function hue(r,g,b){r=Math.max(0,Math.min(255,r))/255;g=Math.max(0,Math.min(255,g))/255;b=Math.max(0,Math.min(255,b))/255;let M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;if(d<.004)return null;let h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;return(h*60+360)%360}
function cn(h){if(h==null)return'中性';if(h<18||h>=345)return'玫瑰紅';if(h<45)return'暖橙';if(h<70)return'淡金';if(h<155)return'青綠';if(h<205)return'青藍';if(h<255)return'霧藍';if(h<300)return'紫羅蘭';return'玫紫'}
go.onclick=async()=>{if(busy)return;busy=1;go.disabled=flip.disabled=true;Q('#res').style.display='none';Q('#pic').style.display=Q('#fx').style.display='none';st.textContent='3 秒空景校準：請離開畫面，手機不要動';let A=await col(3,0,30);st.textContent='請站回中央…';await sl(700);st.textContent='7 秒人體取樣：自然站立';let B=await col(7,30,100),be=mean(A.A,'e'),pe=mean(B.A,'e'),bz=mean(A.A,'z'),pz=mean(B.A,'z'),D=[0,1,2].map(c=>pe[c]-be[c]),rows=[];
for(let z=0;z<7;z++){let d=[0,1,2].map(c=>pz[z][c]-bz[z][c]-D[c]),mag=Math.hypot(...d),h=hue(128+d[0]*3,128+d[1]*3,128+d[2]*3);rows.push({z,mag,h,ok:mag>=7.5})}
let pic=Q('#pic'),fx=Q('#fx');pic.width=fx.width=v.videoWidth;pic.height=fx.height=v.videoHeight;pic.getContext('2d').drawImage(v,0,0,pic.width,pic.height);pic.style.display=fx.style.display='block';let o=fx.getContext('2d');rows.filter(r=>r.ok).forEach(r=>{let cx=fx.width/2,cy=Y[r.z]*fx.height,R=fx.width*.27,h=r.h??50,g=o.createRadialGradient(cx,cy,0,cx,cy,R);g.addColorStop(0,`hsla(${h},80%,65%,.48)`);g.addColorStop(1,`hsla(${h},80%,65%,0)`);o.fillStyle=g;o.fillRect(cx-R,cy-R,R*2,R*2)});
zones.innerHTML='';rows.forEach(r=>zones.innerHTML+=`<div class="z"><i class="dot" style="background:${r.ok?`hsl(${r.h??50},60%,68%)`:'#ccc'}"></i><div><b>${names[r.z]}</b><small>${r.ok?cn(r.h)+' · '+(r.h??0).toFixed(0)+'°':'訊號不足，不產生顏色'}</small></div><div class="val">強度<br><b>${r.mag.toFixed(2)}</b></div></div>`);
let valid=rows.filter(r=>r.ok).length,tem=B.fl.reduce((s,q)=>s+q,0)/Math.max(1,B.fl.length);head.textContent=`7 個區域中，${valid} 區達到顯影門檻`;meta.textContent=`背景 RGB 漂移補償：${D.map(q=>(q>=0?'+':'')+q.toFixed(1)).join(' / ')}　｜　時間波動：${tem.toFixed(2)}`;Q('#res').style.display='block';st.textContent='完成：每區顏色來自本次資料，不套用固定脈輪色。';pg.style.width='100%';busy=0;go.disabled=flip.disabled=false}
</script></main></body></html>
