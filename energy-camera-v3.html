<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Camera 3.0</title><style>
body{margin:0;background:linear-gradient(#fbf8f6,#efedf6);color:#37344d;font-family:-apple-system,"PingFang TC",sans-serif}main{max-width:700px;margin:auto;padding:25px 16px 60px}.brand{text-align:center}.brand h1{font:34px Georgia;letter-spacing:.18em}.card{background:#fffdfc;border-radius:28px;padding:20px;margin:16px 0;box-shadow:0 10px 30px #554b6b12}video,#heat{width:100%;border-radius:22px;background:#191820}video{height:390px;object-fit:cover;transform:scaleX(-1)}button{width:100%;border:0;border-radius:26px;padding:15px;margin-top:12px;background:#7774aa;color:white;font-size:17px;font-weight:bold}.secondary{background:#efebf3;color:#4d4860}.bar{height:11px;background:#ece8ef;border-radius:20px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;width:0;background:#8e86b7}.status{text-align:center;min-height:45px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.m{background:#f4f1f5;border-radius:17px;padding:12px;text-align:center}.m span{display:block;font-size:13px;color:#777}.m b{font-size:20px}.result{text-align:center;display:none}.orb{width:230px;height:230px;border-radius:50%;margin:20px auto;box-shadow:0 0 50px #8177a855}.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.chip{background:#f1ebf2;padding:8px 12px;border-radius:22px}.details{display:none;text-align:left;background:#f7f4f7;padding:15px;border-radius:18px;line-height:1.7}.note{font-size:13px;color:#777386;line-height:1.7}.warn{color:#a64e61}
</style></head><body><main><div class="brand"><h1>SOUL SYSTEM</h1><p>靈魂停看聽 · Energy Camera 3.0 光子影像版</p></div>
<section class="card" id="intro"><h2>✦ 光子影像感測</h2><p>先記錄空景，再記錄人物進入後的相機訊號。這版不使用固定六色答案，而由本次影像的實際色彩與變化連續計算。</p><button id="open">開啟相機</button></section>
<section class="card" id="scan" style="display:none"><video id="v" playsinline muted></video><canvas id="c" width="160" height="120" hidden></canvas><div class="status" id="st">準備中</div><div class="bar"><i id="bar"></i></div><div class="grid"><div class="m"><span>亮度</span><b id="lum">—</b></div><div class="m"><span>色彩濃度</span><b id="sat">—</b></div><div class="m"><span>時間波動</span><b id="fluc">—</b></div><div class="m"><span>品質</span><b id="qual">—</b></div></div><button id="start">開始空景基準（8 秒）</button><button class="secondary" onclick="location.reload()">重新開始</button></section>
<section class="card" id="map" style="display:none"><h2>✦ 像素活動圖</h2><canvas id="heat" width="160" height="120"></canvas><p class="note">亮區表示相機像素訊號相對空景改變較大。這是 CMOS 影像訊號視覺化，不是逐顆光子計數。</p></section>
<section class="card result" id="res"><h3>TODAY'S ENERGY COLOR</h3><div class="orb" id="orb"></div><h1 id="name"></h1><div class="chips" id="chips"></div><h3 id="words"></h3><button class="secondary" id="dataBtn">查看本次實際測量依據</button><div class="details" id="details"></div><p class="note">本頁分析手機 CMOS 接收到的光所形成的影像訊號。一般手機網頁相機不能直接量測 EMF、自由電子、人體氣場或靈體。</p></section>
<script>
const $=x=>document.getElementById(x),v=$("v"),c=$("c"),cx=c.getContext("2d",{willReadFrequently:true}),heat=$("heat"),hx=heat.getContext("2d");let stream,base,basePix,prev,busy=false;
function hsv(r,g,b){r/=255;g/=255;b/=255;let M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m,h=0;if(d){if(M==r)h=60*(((g-b)/d)%6);else if(M==g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}if(h<0)h+=360;return{h:h,s:M?d/M:0,v:M}}
function frame(keep=false){cx.drawImage(v,0,0,160,120);let d=cx.getImageData(0,0,160,120).data,R=0,G=0,B=0,L=0,S=0,F=0,n=d.length/4,pix=new Float32Array(n);for(let p=0,i=0;i<d.length;i+=4,p++){let r=d[i],g=d[i+1],b=d[i+2],l=(r+g+b)/3;R+=r;G+=g;B+=b;L+=l;S+=hsv(r,g,b).s*100;pix[p]=l;if(prev)F+=Math.abs(l-prev[p])}prev=pix;return{r:R/n,g:G/n,b:B/n,lum:L/n,sat:S/n,fluc:F/n,pix:keep?pix:null}}
function avg(a){let o={};["r","g","b","lum","sat","fluc"].forEach(k=>o[k]=a.reduce((z,x)=>z+x[k],0)/a.length);o.pix=a[a.length-1].pix;return o}
function check(s){if(s.lum<18)return["太暗","鏡頭被遮住或太暗"];if(s.lum>242)return["過曝","光線太強"];return["正常",""]}
function update(s){$("lum").textContent=s.lum.toFixed(0);$("sat").textContent=s.sat.toFixed(1)+"%";$("fluc").textContent=s.fluc.toFixed(1);$("qual").textContent=check(s)[0]}
async function phase(sec,label){let a=[];prev=null;for(let i=0;i<sec*4;i++){let s=frame(true);a.push(s);update(s);$("st").textContent=label+" "+Math.ceil((sec*4-i)/4)+" 秒";$("bar").style.width=(i+1)/(sec*4)*100+"%";await new Promise(r=>setTimeout(r,250))}return avg(a)}
function hname(h){if(h<15||h>=345)return["玫瑰紅","活力"];if(h<45)return["暖橙","行動"];if(h<70)return["淡金","穩定"];if(h<155)return["青綠","流動"];if(h<200)return["青藍","清明"];if(h<255)return["深藍","整理"];if(h<300)return["霧紫","沉澱"];return["玫瑰粉","柔軟"]}
function heatmap(p){let im=hx.createImageData(160,120),mx=1,dif=new Float32Array(p.length);for(let i=0;i<p.length;i++){dif[i]=Math.abs(p[i]-basePix[i]);mx=Math.max(mx,dif[i])}for(let i=0;i<dif.length;i++){let t=Math.min(1,dif[i]/Math.max(12,mx*.65)),j=i*4;im.data[j]=255*t;im.data[j+1]=190*t;im.data[j+2]=255*(1-t);im.data[j+3]=255}hx.putImageData(im,0,0);$("map").style.display="block"}
function result(s){let dr=s.r-base.r,dg=s.g-base.g,db=s.b-base.b,rr=Math.min(255,Math.max(0,128+dr*3)),gg=Math.min(255,Math.max(0,128+dg*3)),bb=Math.min(255,Math.max(0,128+db*3)),H=hsv(rr,gg,bb).h,mag=Math.sqrt(dr*dr+dg*dg+db*db);if(mag<3)H=hsv(s.r,s.g,s.b).h;let hs=[H,(H+28)%360,(H+328)%360],inf=hs.map(hname),w=[42,32,26];$("orb").style.background=`radial-gradient(circle,#fff 5%,hsl(${hs[0]} 45% 68%) 32%,hsl(${hs[1]} 42% 61%) 67%,hsl(${hs[2]} 38% 67%))`;$("name").textContent=inf.map(x=>x[0]).join(" × ");$("chips").innerHTML=inf.map((x,i)=>`<span class=chip>${x[0]} ${w[i]}%</span>`).join("");$("words").textContent=inf.map(x=>x[1]).join(" × ");$("details").innerHTML=`空景 RGB：${base.r.toFixed(1)} / ${base.g.toFixed(1)} / ${base.b.toFixed(1)}<br>人物 RGB：${s.r.toFixed(1)} / ${s.g.toFixed(1)} / ${s.b.toFixed(1)}<br>人物－空景：${dr.toFixed(1)} / ${dg.toFixed(1)} / ${db.toFixed(1)}<br>亮度：${s.lum.toFixed(1)}<br>色彩濃度：${s.sat.toFixed(1)}%<br>時間波動：${s.fluc.toFixed(2)}<br>計算主色相：${H.toFixed(1)}°<br>差異強度：${mag.toFixed(2)}`;heatmap(s.pix);$("res").style.display="block";$("res").scrollIntoView({behavior:"smooth"})}
async function open(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});v.srcObject=stream;await v.play();$("intro").style.display="none";$("scan").style.display="block";$("st").textContent="相機已開啟。請先讓人移出畫面，只留下環境。"}catch(e){$("scan").style.display="block";$("st").innerHTML='<span class=warn>請允許瀏覽器使用相機。</span>'}}
async function run(){if(busy)return;busy=true;$("start").disabled=true;base=await phase(8,"記錄空景中");basePix=base.pix;let q=check(base);if(q[0]!="正常")return fail(q[1]);$("bar").style.width="0";$("st").textContent="完成。現在請站入畫面，手機不要移動。";await new Promise(r=>setTimeout(r,3000));let s=await phase(18,"記錄人物影像中");q=check(s);if(q[0]!="正常")return fail(q[1]);if(s.fluc>38)return fail("畫面晃動太大");result(s);$("st").textContent="分析完成";busy=false;$("start").disabled=false}
function fail(t){$("st").innerHTML='<span class=warn>'+t+"，本次不產生顏色，請重新測試。</span>";busy=false;$("start").disabled=false}
$("open").onclick=open;$("start").onclick=run;$("dataBtn").onclick=()=>{$("details").style.display=$("details").style.display=="block"?"none":"block"};
</script></main></body></html>
