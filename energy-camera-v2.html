<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Camera v2</title><style>
body{margin:0;background:linear-gradient(#faf7f5,#eeebf5);color:#39364d;font-family:-apple-system,"PingFang TC",sans-serif}main{max-width:680px;margin:auto;padding:25px 16px 60px}.brand{text-align:center}.brand h1{font-family:Georgia,serif;letter-spacing:.18em}.card{background:#fffdfb;border-radius:28px;padding:20px;margin:15px 0;box-shadow:0 10px 30px #554b6b12}video{width:100%;height:380px;object-fit:cover;border-radius:22px;background:#222;transform:scaleX(-1)}button{width:100%;border:0;border-radius:28px;padding:15px;margin-top:12px;background:#7473a8;color:white;font-size:17px}.secondary{background:#eee9f1;color:#4a465b}.bar{height:11px;background:#eeeaf1;border-radius:20px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:#8c83b3}.status{text-align:center;margin:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#f4f0f4;border-radius:15px;padding:12px;text-align:center}.m b{display:block;font-size:19px}.result{text-align:center;display:none}.orb{width:220px;height:220px;border-radius:50%;margin:18px auto;box-shadow:0 0 45px #8d7db477}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chip{background:#f1ebf2;padding:8px 11px;border-radius:20px}.note{font-size:13px;color:#777285;line-height:1.6}.warn{color:#a55060;font-weight:bold}
</style></head><body><main><div class="brand"><h1>SOUL SYSTEM</h1><p>靈魂停看聽 · Energy Camera 2.0</p></div>
<div class="card" id="intro"><h2>✦ 能量影像掃描</h2><p>這版不預設顏色。先分析 5 秒環境，再分析 15 秒人物影像；只有畫面品質合格才產生色彩。</p><button id="open">開啟相機</button></div>
<div class="card" id="camBox" style="display:none"><video id="v" playsinline muted></video><canvas id="cv" width="160" height="120" hidden></canvas><div class="status" id="st">準備中…</div><div class="bar"><i id="bar"></i></div><div class="grid"><div class="m">亮度<b id="lum">—</b></div><div class="m">色彩濃度<b id="sat">—</b></div><div class="m">畫面變化<b id="mov">—</b></div><div class="m">品質<b id="qual">—</b></div></div><button id="start">開始 5 秒環境校正</button><button class="secondary" onclick="location.reload()">重新開始</button></div>
<div class="card result" id="res"><h3>TODAY'S ENERGY COLOR</h3><div class="orb" id="orb"></div><h1 id="names"></h1><div class="chips" id="chips"></div><h3 id="words"></h3><div style="text-align:left"><h3>🌿 今天陪伴你的香氣</h3><p id="aroma"></p><h4>今晚的小儀式</h4><p>把燈光調柔和，選一個你喜歡的香氣，安靜坐三分鐘，讓注意力回到呼吸與自己。</p></div><p class="note">結果是把本次相機影像可測得的色彩、亮度與變化轉換為 Soul System 色彩語言；不是 EMF、人體氣場或靈體的物理測量。</p></div>
<script>
const $=x=>document.getElementById(x),v=$("v"),cv=$("cv"),cx=cv.getContext("2d",{willReadFrequently:true});let stream,base,last,busy=false;
const P=[["霧紫",[145,125,184],"沉澱","真正薰衣草｜讓節奏慢下來"],["深藍",[72,102,159],"整理","乳香｜留一點空間給呼吸與自己"],["淡金",[204,177,108],"穩定","甜橙｜帶回柔和明亮的感受"],["玫瑰粉",[202,137,157],"柔軟","玫瑰天竺葵｜陪伴情緒回到平衡"],["青綠",[91,151,137],"流動","佛手柑｜讓緊繃感稍微鬆開"],["靛紫",[91,79,143],"內觀","雪松｜讓注意力回到當下"]];
async function openCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});v.srcObject=stream;await v.play();$("intro").style.display="none";$("camBox").style.display="block";$("st").textContent="相機已開啟，先讓鏡頭看到拍攝環境"}catch(e){$("camBox").style.display="block";$("st").innerHTML='<span class="warn">無法開啟相機，請允許相機權限。</span>'}}
function sample(){cx.drawImage(v,0,0,160,120);let d=cx.getImageData(0,0,160,120).data,R=0,G=0,B=0,L=0,S=0,k=0;for(let i=0;i<d.length;i+=16){let r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);R+=r;G+=g;B+=b;L+=(r+g+b)/3;S+=mx?(mx-mn)/mx*100:0;k++}let cur=[R/k,G/k,B/k],m=last?Math.sqrt(cur.reduce((z,x,i)=>z+(x-last[i])**2,0)):0;last=cur;return{r:cur[0],g:cur[1],b:cur[2],lum:L/k,sat:S/k,motion:m}}
function avg(a){let o={};["r","g","b","lum","sat","motion"].forEach(k=>o[k]=a.reduce((z,x)=>z+x[k],0)/a.length);return o}
function quality(s){if(s.lum<18)return["太暗","鏡頭可能被遮住或環境太暗"];if(s.lum>242)return["過曝","環境光線太強"];if(s.sat<1.2&&s.lum<35)return["無法判讀","畫面資訊不足"];return["正常",""]}
async function phase(sec,label){let a=[];last=null;for(let i=0;i<sec*4;i++){let s=sample(),q=quality(s);$("lum").textContent=s.lum.toFixed(0);$("sat").textContent=s.sat.toFixed(0)+"%";$("mov").textContent=s.motion.toFixed(1);$("qual").textContent=q[0];$("st").textContent=label+" "+Math.ceil((sec*4-i)/4)+" 秒";$("bar").style.width=(i+1)/(sec*4)*100+"%";a.push(s);await new Promise(r=>setTimeout(r,250))}return avg(a)}
function make(s){let d=[s.r-base.r,s.g-base.g,s.b-base.b],rgb=[128+d[0]*2+s.r*.25,128+d[1]*2+s.g*.25,128+d[2]*2+s.b*.25].map(x=>Math.max(0,Math.min(255,x)));let a=P.map(p=>({p,d:Math.sqrt(p[1].reduce((z,x,i)=>z+(x-rgb[i])**2,0))})).sort((a,b)=>a.d-b.d).slice(0,3),w=a.map(x=>1/(x.d+20)),sum=w.reduce((x,y)=>x+y),pc=w.map(x=>Math.round(x/sum*100));pc[0]+=100-pc.reduce((x,y)=>x+y);let cols=a.map(x=>"rgb("+x.p[1].join(",")+")");$("orb").style.background=`radial-gradient(circle at 50% 45%,white 0 7%,${cols[0]} 32%,${cols[1]} 68%,${cols[2]} 100%)`;$("names").textContent=a.map(x=>x.p[0]).join(" × ");$("chips").innerHTML=a.map((x,i)=>`<span class="chip">${x.p[0]} ${pc[i]}%</span>`).join("");$("words").textContent=a.map(x=>x.p[2]).join(" × ");$("aroma").innerHTML=a.slice(0,2).map(x=>"<b>"+x.p[3].split("｜")[0]+"</b>｜"+x.p[3].split("｜")[1]).join("<br>");$("res").style.display="block";$("res").scrollIntoView({behavior:"smooth"});$("st").textContent="分析完成"}
async function run(){if(busy)return;busy=true;$("start").disabled=true;$("res").style.display="none";base=await phase(5,"環境校正中");let q=quality(base);if(q[0]!="正常")return fail(q[1]);$("st").textContent="環境完成。現在請把自己放入畫面中央";$("bar").style.width="0";await new Promise(r=>setTimeout(r,2500));let s=await phase(15,"人物掃描中");q=quality(s);if(q[0]!="正常")return fail(q[1]);if(s.motion>28)return fail("畫面變化太大，請保持手機與人物穩定");make(s);busy=false;$("start").disabled=false}
function fail(t){$("st").innerHTML='<span class="warn">'+t+"，本次不產生色彩，請重新測試。</span>";busy=false;$("start").disabled=false}
$("open").onclick=openCam;$("start").onclick=run;
</script></main></body></html>
